<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Andhra Ruchulu</title>
    <link href="index.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-utensils"></i>
                <h1>Andhra Ruchulu</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Signup</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <section style="padding:80px 20px; max-width:900px; margin:0 auto;">
        <h2 style="text-align:center; margin-bottom:20px;">Your Cart</h2>
        <div id="cart-items" style="background:#fff; padding:20px; border-radius:12px; box-shadow:var(--shadow); min-height:120px;"></div>
        <div class="cart-actions">
            <div class="cart-total">Total: <span id="cart-total">₹0</span></div>
            <div>
                <button id="checkout-btn" class="btn btn-primary">Checkout</button>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-bottom">
            <p>&copy; 2024 Andhra Ruchulu</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
