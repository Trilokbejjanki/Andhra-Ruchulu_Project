<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Andhra Ruchulu</title>
    <link href="index.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-utensils"></i>
                <h1>Andhra Ruchulu</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="signup.html">Signup</a></li>

            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <section style="padding:80px 20px; max-width:600px; margin:0 auto;">
        <h2 style="text-align:center; margin-bottom:20px;">Login</h2>
        <div style="background:#fff; padding:30px; border-radius:12px; box-shadow:var(--shadow);">
            <form id="login-form">
                <input type="email" name="email" placeholder="Email" required style="width:100%; padding:12px; margin-bottom:12px;">
                <input type="password" name="password" placeholder="Password" required style="width:100%; padding:12px; margin-bottom:12px;">
                <button class="btn btn-primary" type="submit">Login</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="footer-bottom">
